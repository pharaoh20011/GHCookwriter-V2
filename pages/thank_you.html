<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <title>Thank You | GHCookwriter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap" rel="stylesheet" />

    <!-- Compiled stylesheet -->

    <!-- Favicons -->
    <link rel="icon" href="../favicon/favicon_32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="../favicon/favicon_16.png" type="image/png" sizes="16x16" />

  </head>

  <body class="thank-you-page min-h-screen flex flex-col justify-between selection:bg-slate-800 selection:text-white bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-slate-950 text-slate-300 relative overflow-x-hidden">
    
    <!-- Background vector polygon texture overlay -->
    <div class="absolute inset-0 bg-cover bg-center opacity-15 pointer-events-none z-0" style="background-image: url('../assets/images/polygon.webp');"></div>
    
    <!-- MOBILE MENU DRAWER -->
    <div class="site-mobile-menu fixed top-0 right-0 h-full w-[300px] bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out border-l border-slate-100" aria-hidden="true">
      <div class="flex items-center justify-between p-6 border-b border-slate-100">
        <span class="font-oswald text-xl font-bold tracking-wider text-slate-900">NAVIGATION</span>
        <button class="js-menu-toggle p-2 text-slate-500 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-primary rounded-full transition-colors" aria-label="Close mobile menu">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="site-mobile-menu-body py-4 flex flex-col"></div>
    </div>

    <!-- NAVBAR -->
    <header class="fixed top-0 left-0 w-full z-40 transition-all duration-300 js-sticky-header py-5 bg-transparent">
      <div class="max-w-7xl mx-auto px-6">
        <div class="flex items-center justify-between">
          
          <div class="flex items-center gap-3">
            <a href="../index.html" class="logo-link focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 rounded-lg transition-all" aria-label="GHCookwriter Home">
              <img
                src="../assets/images/site_icon.webp"
                alt="GHCOOK Writer logo featuring stylized book with feather quill and sparkles, representing The Encounter Trilogy"
                class="h-12 w-auto object-contain hover:scale-105 transition-transform"
              />
            </a>
            <span class="logo-text font-oswald text-xl md:text-2xl font-light text-white tracking-widest">
              GHCOOK<span class="font-bold text-primary">writer</span>
            </span>
          </div>

          <nav class="hidden lg:block" role="navigation" aria-label="Main Navigation">
            <ul class="flex items-center gap-8 js-clone-nav">
              <li><a href="../index.html#home-section" class="text-white/80 hover:text-white font-medium text-sm tracking-widest uppercase transition-colors duration-200 py-2 border-b-2 border-transparent hover:border-primary">Home</a></li>
              <li><a href="../index.html#contact-section" class="text-white/80 hover:text-white font-medium text-sm tracking-widest uppercase transition-colors duration-200 py-2 border-b-2 border-transparent hover:border-primary">Contact</a></li>
            </ul>
          </nav>

          <div class="lg:hidden">
            <a href="#" class="site-menu-toggle js-menu-toggle p-2 text-white hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary rounded-lg inline-flex items-center justify-center" aria-label="Toggle navigation" aria-expanded="false">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </a>
          </div>

        </div>
      </div>
    </header>

    <!-- CONFIRMATION BOX -->
    <main class="flex-grow flex items-center justify-center pt-32 pb-16 px-6 relative z-10">
      <div class="max-w-xl w-full bg-white border border-slate-100 p-8 md:p-12 rounded-3xl text-center shadow-2xl relative animate-fade-in flex flex-col items-center">
        
        <img
          src="../assets/images/books_1_2_3_new.webp"
          alt="Books 1, 2, and 3 of The Encounter Trilogy"
          class="w-56 h-auto object-contain drop-shadow-xl mb-8 transform hover:scale-102 transition-transform duration-300"
        />
        
        <h1 class="text-slate-900 font-oswald text-3xl md:text-4xl font-bold uppercase tracking-wider mb-4">
          Thank you.
        </h1>
        
        <div class="h-1 w-16 bg-primary mb-6 rounded-full"></div>

        <p class="text-slate-600 text-base md:text-lg font-light leading-relaxed mb-8">
          Your message was successfully sent! I will get back to you as soon as possible.
        </p>

        <div class="w-full border-t border-slate-100 pt-6 flex flex-col items-center">
          <img
            src="../assets/images/signature.webp"
            alt="Signature of GHCOOK Writer, author of The Encounter Trilogy"
            class="h-16 w-auto object-contain mb-2"
          />
          <span class="text-slate-500 text-xs tracking-wider uppercase font-light">George H. Cook</span>
        </div>

        <a
          href="../index.html"
          class="mt-8 px-8 py-4 bg-primary hover:bg-primary-hover text-white text-sm font-bold tracking-wider rounded-full shadow-md hover:shadow-primary/30 hover:scale-[1.02] transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-white"
        >
          Return Home
        </a>

      </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-950 border-t border-slate-900 py-12 text-center text-xs text-slate-500 relative z-10">
      <div class="max-w-7xl mx-auto px-6">
        <p>
          Copyright &copy;
          <script>
            document.write(new Date().getFullYear());
          </script>
          All rights reserved | GHCookwriter
        </p>
      </div>
    </footer>

    <!-- Main JS file -->
    <script src="../assets/js/main.js"></script>

</html>
